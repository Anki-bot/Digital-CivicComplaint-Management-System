<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Departments — JanSeva Pro</title><link rel="stylesheet" href="css/style.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></head><body>
<div class="tricolor"></div><nav class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">🏛️</span><span>JanSeva<small>DEPARTMENTS</small></span></a><button class="menu-btn" id="menuToggle">☰</button><div class="nav-links" id="navLinks"><a href="index.html">Home</a><a href="about.html">About</a><a href="faq.html">FAQ</a><a href="contact.html">Contact</a><button class="icon-btn" id="themeBtn">🌙</button></div></div></nav>
<section class="section"><div class="container"><h2 class="section-title">City Departments 🏢</h2><p class="section-sub">Complaints auto-route here; admins assign staff inside.</p><div class="grid-3" id="deptGrid"></div></div></section>
<footer><div class="copy">© <span id="year"></span> JanSeva</div></footer>
<script src="js/data.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/ui.js"></script><script src="js/main.js"></script>
<script>document.addEventListener('DOMContentLoaded',async()=>{let depts=DEPARTMENTS;try{if(typeof API!=='undefined'&&API.serverMode){const d=await API.req('/api/departments');if(d.departments) depts=d.departments;}}catch{}let counts={};try{if(typeof API!=='undefined'&&API.serverMode){const r=await API.req('/api/complaints/public');(r.complaints||[]).forEach(c=>{counts[c.assigned_dept||c.assignedDept]=(counts[c.assigned_dept||c.assignedDept]||0)+1;});}else{getComplaints().forEach(c=>{counts[c.assignedDept]=(counts[c.assignedDept]||0)+1;});}}catch{}document.getElementById('deptGrid').innerHTML=depts.map(d=>{const n=counts[d.id]||0;return `<div class="card hover"><div class="dept-icon">${d.icon}</div><h3>${escapeHTML(d.name)}</h3><p>Head: ${escapeHTML(d.head)}<br>Helpline: ${escapeHTML(d.phone)}<br>Active cases: <b>${n}</b></p><a class="btn btn-primary btn-sm" style="margin-top:8px" href="file-complaint.html">Report here</a></div>`;}).join('');});</script>
</body></html>
