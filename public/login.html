<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login — JanSeva Pro</title><link rel="manifest" href="manifest.json"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body>
<div class="tricolor"></div><nav class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">🏛️</span><span>JanSeva<small>LOGIN</small></span></a><button class="menu-btn" id="menuToggle">☰</button><div class="nav-links" id="navLinks"><a href="index.html">Home</a><a href="track.html">Track</a><a href="login.html">Login</a><a href="register.html" class="btn btn-accent btn-sm" style="color:#1f2937">Register</a><button class="icon-btn" id="themeBtn">🌙</button></div></div></nav>
<section class="section"><div class="container"><div class="card form-wrap"><h2>Welcome back 👋</h2><p style="color:var(--muted);font-size:.92rem">Login to file, upvote and rate resolutions.</p>
<form id="loginForm" novalidate><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" required><label for="password">Password</label><input id="password" type="password" placeholder="••••••••" required><p class="error-msg" id="loginErr"></p><button class="btn btn-primary" style="width:100%;margin-top:18px" type="submit">Login</button></form>
<p class="auth-switch">No account? <a href="register.html">Register</a></p>
<div class="card" style="margin-top:16px;background:var(--bg);font-size:.85rem"><b>Demo:</b><br>Citizen — demo@citizen.com / Demo123!<br>Admin — admin@civic.com / Admin123!</div></div></div></section>
<footer><div class="copy">© <span id="year"></span> JanSeva</div></footer>
<script src="js/data.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/ui.js"></script><script src="js/main.js"></script>
<script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value,pw=document.getElementById('password').value,err=document.getElementById('loginErr');if(!email||!pw){err.style.display='block';err.textContent='Enter email and password.';return;}const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Logging in…';try{const r=await doLogin(email,pw);if(!r.ok){err.style.display='block';err.textContent=r.msg;showToast(r.msg,'error');return;}showToast('Login successful!','success');setTimeout(()=>{location.href=(r.user&&(r.user.role==='admin'||r.user.role==='staff'))?'admin.html':'dashboard.html';},600);}finally{btn.disabled=false;btn.textContent='Login';}});</script>
</body></html>
