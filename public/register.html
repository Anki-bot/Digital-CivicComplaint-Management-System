<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register — JanSeva Pro</title><link rel="manifest" href="manifest.json"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body>
<div class="tricolor"></div><nav class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">🏛️</span><span>JanSeva<small>REGISTER</small></span></a><button class="menu-btn" id="menuToggle">☰</button><div class="nav-links" id="navLinks"><a href="index.html">Home</a><a href="track.html">Track</a><a href="login.html">Login</a><a href="register.html" class="btn btn-accent btn-sm" style="color:#1f2937">Register</a><button class="icon-btn" id="themeBtn">🌙</button></div></div></nav>
<section class="section"><div class="container"><div class="card form-wrap"><h2>Create citizen account 📝</h2><p style="color:var(--muted);font-size:.92rem">Free forever. File, upvote, comment, rate.</p>
<form id="regForm" novalidate><label for="name">Full Name</label><input id="name" placeholder="e.g. Rahul Sharma" required><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" required><label for="phone">Phone (10 digits)</label><input id="phone" maxlength="10" placeholder="9876543210" required><label for="password">Password (min 6)</label><input id="password" type="password" placeholder="Choose strong password" required><p class="error-msg" id="regErr"></p><button class="btn btn-primary" style="width:100%;margin-top:18px" type="submit">Register</button></form>
<p class="auth-switch">Already registered? <a href="login.html">Login</a></p></div></div></section>
<footer><div class="copy">© <span id="year"></span> JanSeva</div></footer>
<script src="js/data.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/ui.js"></script><script src="js/main.js"></script>
<script>document.getElementById('regForm').addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),phone=document.getElementById('phone').value.trim(),pw=document.getElementById('password').value,err=document.getElementById('regErr');const fail=m=>{err.style.display='block';err.textContent=m;showToast(m,'error');};if(name.length<3)return fail('Enter full name.');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return fail('Enter valid email.');if(!/^[0-9]{10}$/.test(phone))return fail('Phone must be 10 digits.');if(pw.length<6)return fail('Password min 6 chars.');const r=await doRegister({name,email,phone,password:pw});if(!r.ok)return fail(r.msg);showToast('Account created!','success');setTimeout(()=>location.href='dashboard.html',700);});</script>
</body></html>
