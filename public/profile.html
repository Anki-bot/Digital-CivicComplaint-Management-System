<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profile — JanSeva Pro</title><link rel="stylesheet" href="css/style.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></head><body>
<div class="tricolor"></div><nav class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">🏛️</span><span>JanSeva<small>PROFILE</small></span></a><button class="menu-btn" id="menuToggle">☰</button><div class="nav-links" id="navLinks"><a href="index.html">Home</a><a href="dashboard.html" data-auth="user">My Complaints</a><a href="track.html">Track</a><span id="navUser" data-auth="user" style="color:#fbbf24;font-size:.85rem"></span><a href="#" data-auth="user" data-logout>Logout</a><button class="icon-btn" id="themeBtn">🌙</button></div></div></nav>
<section class="section"><div class="container"><div class="card form-wrap" style="max-width:640px"><h2>👤 My Profile</h2><div id="profBox"></div>
<h3 style="margin-top:18px">🔔 Notifications</h3><div id="notifList"></div>
<div style="margin-top:16px;display:flex;gap:8px"><a class="btn btn-primary btn-sm" href="dashboard.html">My Complaints</a><a class="btn btn-outline btn-sm" href="#" data-logout>Logout</a></div></div></div></section>
<footer><div class="copy">© <span id="year"></span> JanSeva</div></footer>
<script src="js/data.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/ui.js"></script><script src="js/main.js"></script><script src="js/engage.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{if(!requireAuth())return;const u=currentUser();const mine=getComplaints().filter(c=>c.userEmail===u.email);document.getElementById('profBox').innerHTML=`<p><b>${escapeHTML(u.name)}</b><br>${escapeHTML(u.email)} • ${escapeHTML(u.phone||'')}<br>Role: ${escapeHTML(u.role)} • Member since ${formatDate(u.createdAt)}</p><div class="grid-4" style="margin-top:12px"><div class="stat"><b>${mine.length}</b><span>Filed</span></div><div class="stat"><b>${mine.filter(c=>c.status==='Resolved').length}</b><span>Resolved</span></div><div class="stat"><b>${mine.reduce((s,c)=>s+(c.upvotes||[]).length,0)}</b><span>Upvotes</span></div><div class="stat"><b>${mine.filter(c=>isOverdue(c)).length}</b><span>Overdue</span></div></div>`;renderNotifs();});</script>
</body></html>
