<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profile — JanSeva Pro</title><link rel="stylesheet" href="css/style.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></head><body>
<div class="tricolor"></div><nav class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">🏛️</span><span>JanSeva<small>PROFILE</small></span></a><button class="menu-btn" id="menuToggle">☰</button><div class="nav-links" id="navLinks"><a href="index.html">Home</a><a href="departments.html">Departments</a><a href="about.html">About</a><a href="faq.html">FAQ</a><a href="file-complaint.html" data-auth="user" data-i18n="file">File a Complaint</a><a href="dashboard.html" data-auth="user" data-i18n="my">My Complaints</a><a href="track.html" data-i18n="track">Track by ID</a><a href="admin.html" data-auth="admin" data-i18n="admin">Admin</a><a href="profile.html" data-auth="user">Profile</a><a href="login.html" data-auth="guest" data-i18n="login">Login</a><a href="register.html" data-auth="guest" class="btn btn-accent btn-sm" style="color:#1f2937">Register</a><span id="navUser" data-auth="user" style="color:#fbbf24;font-size:.85rem"></span><a href="#" data-auth="user" data-logout>Logout</a><button class="icon-btn" id="themeBtn" title="Dark mode">🌙</button><button class="icon-btn" id="langBtn" title="Language">हिं</button></div></div></nav>
<section class="section"><div class="container"><div class="card form-wrap" style="max-width:640px"><h2>👤 My Profile</h2><div id="profBox"></div>
<h3 style="margin-top:18px">🔔 Notifications</h3><div id="notifList"></div>
<div style="margin-top:16px;display:flex;gap:8px"><a class="btn btn-primary btn-sm" href="dashboard.html">My Complaints</a><a class="btn btn-outline btn-sm" href="#" data-logout>Logout</a></div></div></div></section>
<footer><div class="copy">© <span id="year"></span> JanSeva</div></footer>
<script src="js/data.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/ui.js"></script><script src="js/main.js"></script><script src="js/engage.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!requireAuth()) return;
  const u = currentUser();
  let mine = [];
  try {
    if (typeof API !== 'undefined' && API.serverMode && API.token) {
      const d = await API.req('/api/complaints/mine');
      mine = (d.complaints || []).map(c => {
        c.status = c.status || 'Pending';
        c.upvotes = c.upvotes || [];
        c.upvotesCount = c.upvotesCount ?? c.upvotes_count ?? c.upvotes.length;
        c.slaDue = c.slaDue || c.sla_due;
        c.createdAt = c.createdAt || c.created_at;
        return c;
      });
    } else {
      mine = getComplaints().filter(c => c.userEmail === u.email);
    }
  } catch {
    mine = typeof getComplaints === 'function' ? getComplaints().filter(c => c.userEmail === u.email) : [];
  }
  const filed = mine.length;
  const resolved = mine.filter(c => c.status === 'Resolved').length;
  const upvotes = mine.reduce((s, c) => s + (c.upvotesCount || (c.upvotes || []).length || 0), 0);
  const overdue = mine.filter(c => {
    const due = c.slaDue || c.sla_due;
    return c.status !== 'Resolved' && c.status !== 'Rejected' && due && new Date() > new Date(due);
  }).length;
  document.getElementById('profBox').innerHTML = `<p><b>${escapeHTML(u.name)}</b><br>${escapeHTML(u.email)} • ${escapeHTML(u.phone || '')}<br>Role: ${escapeHTML(u.role)} • Member since ${formatDate(u.created_at || u.createdAt)}</p>
  <div class="grid-4" style="margin-top:12px">
    <div class="stat"><b>${filed}</b><span>Filed</span></div>
    <div class="stat"><b>${resolved}</b><span>Resolved</span></div>
    <div class="stat"><b>${upvotes}</b><span>Upvotes</span></div>
    <div class="stat"><b>${overdue}</b><span>Overdue</span></div>
  </div>`;
  renderNotifs();
});
</script>
</body></html>
